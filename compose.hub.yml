# Producción desde Docker Hub. No requiere compilar ni instalar .NET.
name: biblioteca-virtual-prod
x-api-env: &id001
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  ConnectionStrings__Library: Server=${DB_HOST};Port=${DB_PORT:-3306};Database=${DB_NAME};User=${DB_USER};Password=${DB_PASSWORD};SslMode=Preferred;
  Cors__AllowedOrigins__0: https://${FRONTEND_DOMAIN}
  AllowedHosts: ${BACKEND_DOMAIN};api
  DataProtection__KeysPath: /keys
  Demo__EnableFailureSimulation: 'false'
services:
  migrate:
    image: marioalabi/biblioteca-api:${IMAGE_TAG:-3.0.0}
    environment: *id001
    volumes:
    - api-keys:/keys
    - api-uploads:/app/wwwroot/uploads
    command:
    - --migrate
    restart: 'no'
  api:
    image: marioalabi/biblioteca-api:${IMAGE_TAG:-3.0.0}
    environment: *id001
    volumes:
    - api-keys:/keys
    - api-uploads:/app/wwwroot/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  web:
    image: marioalabi/biblioteca-web:${WEB_IMAGE_TAG:-3.0.0}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__PublicUrl: https://${BACKEND_DOMAIN}
      AllowedHosts: ${FRONTEND_DOMAIN};web
    depends_on:
    - api
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    ports:
    - 80:80
    - 443:443
    - 443:443/udp
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN}
    volumes:
    - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy-data:/data
    - caddy-config:/config
    depends_on:
    - api
    - web
    restart: unless-stopped
volumes:
  api-keys: null
  api-uploads: null
  caddy-data: null
  caddy-config: null
