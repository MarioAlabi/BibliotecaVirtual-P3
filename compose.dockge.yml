# Ejecutar desde la carpeta completa del proyecto con el archivo privado de entorno.
# Conserva los nombres de servicio, puertos y volumen del stack existente.
services:
  backend:
    image: marioalabi/biblioteca-api:1.1.0
    build:
      context: .
      dockerfile: src/Biblioteca.Api/Dockerfile
    restart: unless-stopped
    ports:
      - 5081:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Library: "Server=${DB_HOST:-100.64.0.1};Port=${DB_PORT:-3306};Database=${DB_NAME:-biblioteca_virtual};User=${DB_USER:-mvilleda};Password=${DB_PASSWORD:?Configura DB_PASSWORD};SslMode=Preferred;"
      Cors__AllowedOrigins__0: https://biblioteca.marioalabi.com
      DataProtection__KeysPath: /keys
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - sesiones:/keys
    entrypoint: ["/bin/sh", "-c"]
    command: ["dotnet Biblioteca.Api.dll --migrate && exec dotnet Biblioteca.Api.dll"]
  frontend:
    image: marioalabi/biblioteca-web:1.1.1
    build:
      context: .
      dockerfile: src/Biblioteca.Web/Dockerfile
    restart: unless-stopped
    ports:
      - 5080:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__PublicUrl: https://biblioteca-api.marioalabi.com
    depends_on:
      - backend
volumes:
  sesiones: null
